<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Trang không tìm thấy | SnakeMedia</title>
  <style>
    :root {
      --bg-navy: #0B2055;
      --yellow: #FDB813;
      --text: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at center, #14327C 0%, var(--bg-navy) 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .code { font-size: 6rem; font-weight: 900; color: var(--yellow); line-height: 1; }
    h1 { font-size: 1.75rem; margin: 1rem 0 0.5rem; }
    p { color: #A0B3D7; margin-bottom: 2rem; max-width: 420px; }
    .btn {
      display: inline-block;
      background: var(--yellow);
      color: #0F172A;
      font-weight: 700;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(253, 184, 19, 0.4);
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Trang không tồn tại</h1>
  <p>Địa chỉ bạn truy cập có thể đã thay đổi hoặc không tồn tại trên hệ thống của SnakeMedia.</p>
  <a href="./" class="btn">Về trang chủ SnakeMedia ↗</a>
</body>
</html>
